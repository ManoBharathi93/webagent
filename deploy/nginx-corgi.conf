# Corgi insurance advisor — separate server block from composio.
# Cloudflare terminates HTTPS; nginx serves HTTP on port 80.
# The app runs on :8788 (not 8787, so it can coexist with the composio agent).

server {
    listen 80;
    server_name corgi.agentnet.it.com;

    location / {
        proxy_pass http://WEBAGENT_UPSTREAM;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
