name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck (advisory)
        # Reports vulnerabilities but does not fail the build: findings are typically
        # standard-library CVEs tied to the runner's Go patch version, or transitive
        # advisories our code does not call. Reviewed on each run, not gated.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
