# golangci-lint v2 configuration. See https://golangci-lint.run
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose   # HTTP response bodies are closed
    - errorlint   # correct errors.Is/As usage and %w wrapping
    - misspell    # common spelling mistakes in comments/strings
    - unconvert   # remove unnecessary type conversions

formatters:
  enable:
    - gofmt
    - goimports
